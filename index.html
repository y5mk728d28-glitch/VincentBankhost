<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vincent Bank MVP</title>
<style>
:root{--bg:#080808;--panel:#111;--panel2:#191919;--gold:#d4af37;--gold2:#f1d778;--text:#f7f3e8;--muted:#a9a093;--line:#322b16;--red:#ff6b6b;--green:#65d38c;--blue:#86b7ff;--paper:#fff;--ink:#111}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#050505,#16120a);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#070707;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--gold)}.small{font-size:12px;color:var(--muted)}.nav{margin-top:24px;display:grid;gap:8px}.nav button{background:transparent;border:1px solid transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:12px}.nav button:hover,.nav button.on{background:var(--panel2);border-color:var(--line);color:var(--gold2)}.main{padding:22px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.h1{font-size:26px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:rgba(17,17,17,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 16px 40px #0008}.metric{font-size:24px;font-weight:900;color:var(--gold2)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 5px}.form input,.form select,.form textarea{width:100%;background:#090909;border:1px solid #3b321b;color:var(--text);border-radius:12px;padding:10px}.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid #d4af3740;border-color:var(--gold)}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.gold{background:linear-gradient(135deg,var(--gold),#ffe88b);color:#111}.dark{background:#202020;color:var(--text);border:1px solid #393939}.red{background:#331414;color:#ffd0d0;border:1px solid #6d2222}.green{background:#14331f;color:#caffd9;border:1px solid #246d39}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #2b2616;text-align:left}.table th{color:var(--gold2);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}.active{background:#132718;color:#7ee398}.late{background:#341717;color:#ff9494}.paid{background:#17304a;color:#9dccff}.pending{background:#2a2924;color:#cfc7b3}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:18px}.box{width:min(920px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid var(--line);border-radius:20px;padding:20px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:min(430px,100%)}.doc{background:var(--paper);color:var(--ink);padding:34px;line-height:1.55;position:relative;font-family:Georgia,'Times New Roman',serif}.doc:before{content:'Vincent Bank';position:absolute;inset:35% auto auto 12%;font-size:72px;font-weight:900;color:#000;opacity:.055;transform:rotate(-22deg);white-space:nowrap}.doc h1{text-align:center;margin:0 0 18px;font-size:24px}.doc h2{font-size:15px;margin:18px 0 6px;text-transform:uppercase}.doc .head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:16px}.sig{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:36px}.line{border-top:1px solid #111;padding-top:5px}.doc-actions{margin-bottom:10px}.warn{background:#2c2208;border:1px solid #6b571d;color:#ffe9a1;padding:10px;border-radius:12px;margin-bottom:12px}.mobile{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;transform:translateX(-105%);transition:.2s;width:260px}.side.open{transform:none}.mobile{display:inline-flex}.cards,.grid2,.grid3{grid-template-columns:1fr}.main{padding:14px}.table{font-size:12px}.doc{padding:18px}.doc:before{font-size:42px}.sig{grid-template-columns:1fr}}@media print{body{background:white}.side,.top,.doc-actions,.no-print{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;border:0}.doc{padding:20px}.doc:before{display:block}.printOnly{display:block!important}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><div class="brand">Vincent <span>Bank</span></div><p class="small">MVP privado · localStorage · exporta backups JSON</p><div class="warn">Protección básica. No es seguridad bancaria: los datos se guardan en este navegador.</div><div class="form"><label>Usuario</label><input id="loginUser" value="admin"><label>Contraseña</label><input id="loginPass" type="password" value="changeMe123"><button class="btn gold" style="width:100%;margin-top:12px" onclick="login()">Entrar</button><p id="loginErr" class="small" style="color:var(--red)"></p></div></div></div>
<div id="app" class="app hide"><aside id="side" class="side"><div class="brand">Vincent <span>Bank</span></div><div class="small" id="roleLine"></div><div class="nav"><button onclick="show('dash')">Dashboard</button><button onclick="show('newApp')">Solicitud</button><button onclick="show('loans')">Préstamos</button><button onclick="show('clients')">Clientes</button><button onclick="show('settings')">Settings</button><button onclick="exportJSON()">Export JSON</button><button onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept=".json" class="hide" onchange="importJSON(event)"><button onclick="logout()">Salir</button></div><p class="small" style="margin-top:20px">v1.0 clean build</p></aside><main class="main"><div class="top"><button class="btn dark mobile" onclick="side.classList.toggle('open')">☰</button><div><div class="h1" id="title">Dashboard</div><div class="small" id="sub"></div></div><div class="row" id="topActions"></div></div><section id="page"></section></main></div><div id="modal"></div>
<script>
const KEY='vincentbank_clean_v1';
const STATES={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',ES:'Spain'};
let db={settings:{business:'Vincent Bank',lender:'Alberto del Rio',email:'',phone:'',address:'Nevada, USA',defaultState:'NV',methods:'Cash, Zelle, Cash App, Venmo',username:'admin',password:'changeMe123',grace:5,lateFee:5,scoreBase:70},clients:[],applications:[],loans:[],payments:[],documents:[],scoreLog:[]};
let session=null, current='dash';
const $=id=>document.getElementById(id), money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), rnd=n=>Math.round((Number(n)||0)*100)/100;
function load(){try{const raw=localStorage.getItem(KEY); if(raw) db={...db,...JSON.parse(raw)};}catch(e){}} function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function detectState(addr=''){let a=(' '+addr+' ').toUpperCase(); for(const [code,name] of Object.entries(STATES)){ if(new RegExp('\\b'+code+'\\b').test(a)||a.includes(name.toUpperCase())) return code;} return db.settings.defaultState||'NV';}
function genId(type,state){let d=new Date(), yy=String(d.getFullYear()).slice(2), mm=String(d.getMonth()+1).padStart(2,'0'); let id; do{id=`${type}-${state||db.settings.defaultState||'NV'}-${yy}${mm}-${Math.floor(1000000+Math.random()*9000000)}`;}while(allIds().includes(id)); return id;}
function allIds(){return [...db.clients.map(x=>x.id),...db.applications.map(x=>x.id),...db.loans.map(x=>x.id),...db.payments.map(x=>x.id),...db.documents.map(x=>x.id)];}
function login(){load(); if($('loginUser').value===db.settings.username&&$('loginPass').value===db.settings.password){session={role:'admin',user:db.settings.username}; localStorage.setItem('vb_session',JSON.stringify(session)); $('login').classList.add('hide'); $('app').classList.remove('hide'); $('roleLine').textContent='Admin · '+session.user; show('dash');}else $('loginErr').textContent='Usuario o contraseña incorrectos';}
function restore(){load(); try{session=JSON.parse(localStorage.getItem('vb_session'));}catch{} if(session){$('login').classList.add('hide'); $('app').classList.remove('hide'); $('roleLine').textContent='Admin · '+session.user; show('dash');}}
function logout(){localStorage.removeItem('vb_session'); location.reload();}
function setTitle(t,s=''){ $('title').textContent=t; $('sub').textContent=s; $('topActions').innerHTML=''; document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));}
function show(p,id){current=p; side.classList.remove('open'); if(p==='dash') dash(); if(p==='newApp') newApplication(); if(p==='loans') loansList(); if(p==='clients') clientsList(); if(p==='settings') settingsPage(); if(p==='detail') loanDetail(id);}
function dash(){setTitle('Dashboard','Resumen general'); let totalL=db.loans.reduce((s,l)=>s+l.principal,0), collected=db.payments.reduce((s,p)=>s+p.amount,0), balance=db.loans.reduce((s,l)=>s+loanSummary(l).remaining,0), late=db.loans.filter(l=>loanSummary(l).overdue>0).length; $('topActions').innerHTML='<button class="btn gold" onclick="show(\'newApp\')">Nueva solicitud</button>'; $('page').innerHTML=`<div class="cards"><div class="card"><div class="small">Capital prestado</div><div class="metric">${money(totalL)}</div></div><div class="card"><div class="small">Cobrado</div><div class="metric">${money(collected)}</div></div><div class="card"><div class="small">Balance pendiente</div><div class="metric">${money(balance)}</div></div><div class="card"><div class="small">Préstamos tarde</div><div class="metric">${late}</div></div></div><div class="card"><h3>Préstamos recientes</h3>${loanTable(db.loans.slice(-8).reverse())}</div>`;}
function newApplication(){setTitle('Solicitud de préstamo','Offer → Approval → Contract'); $('page').innerHTML=`<div class="card form"><h3>Borrower / Solicitud</h3><div class="grid2"><div><label>Nombre</label><input id="a_name" oninput="updatePreviewId()"></div><div><label>Teléfono</label><input id="a_phone"></div></div><div class="grid2"><div><label>Email</label><input id="a_email"></div><div><label>Dirección</label><input id="a_address" placeholder="Las Vegas, NV" oninput="updatePreviewId()"></div></div><div class="grid3"><div><label>Monto solicitado</label><input id="a_amount" type="number" value="2000"></div><div><label>Plazo / # pagos</label><input id="a_terms" type="number" value="12"></div><div><label>Frecuencia</label><select id="a_freq"><option value="monthly">Mensual</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="daily">Diario</option><option value="annual">Anual</option></select></div></div><div class="grid2"><div><label>Propósito</label><textarea id="a_purpose"></textarea></div><div><label>Garantía ofrecida</label><textarea id="a_collateral" placeholder="Honda Civic 2012 VIN..."></textarea></div></div><p class="small">ID preliminar: <b id="previewId">—</b></p><button class="btn gold" onclick="createApplication()">Guardar solicitud</button></div><div class="card" style="margin-top:14px"><h3>Solicitudes</h3>${applicationsTable()}</div>`;}
function updatePreviewId(){let st=detectState($('a_address').value); $('previewId').textContent=`AP-${st}-YYMM-RANDOM7`;}
function createApplication(){let addr=$('a_address').value, st=detectState(addr), name=$('a_name').value.trim(); if(!name) return alert('Nombre requerido'); let app={id:genId('AP',st),state:st,name,phone:$('a_phone').value,email:$('a_email').value,address:addr,amount:+$('a_amount').value||0,terms:+$('a_terms').value||12,freq:$('a_freq').value,purpose:$('a_purpose').value,collateral:$('a_collateral').value,status:'Submitted',createdAt:today()}; db.applications.push(app); save(); show('newApp');}
function applicationsTable(){if(!db.applications.length)return '<p class="small">No hay solicitudes.</p>'; return `<table class="table"><tr><th>ID</th><th>Cliente</th><th>Monto</th><th>Estado</th><th></th></tr>${db.applications.map(a=>`<tr><td>${a.id}</td><td>${a.name}<br><span class="small">${a.address}</span></td><td>${money(a.amount)}</td><td><span class="tag pending">${a.status}</span></td><td><button class="btn gold" onclick="approveApp('${a.id}')">Aprobar / crear loan</button></td></tr>`).join('')}</table>`;}
function approveApp(id){let a=db.applications.find(x=>x.id===id); if(!a)return; openLoanModal(a);}
function openLoanModal(app){$('modal').innerHTML=`<div class="modal"><div class="box form"><h2>Crear préstamo desde solicitud</h2><div class="grid3"><div><label>Tipo</label><select id="l_type" onchange="calcPreview()"><option value="flat">Flat/simple</option><option value="apr">APR amortizado</option></select></div><div><label>Rate %</label><input id="l_rate" type="number" value="20" oninput="calcPreview()"></div><div><label>Pagos</label><input id="l_terms" type="number" value="${app.terms}" oninput="calcPreview()"></div></div><div class="grid3"><div><label>Monto</label><input id="l_amount" type="number" value="${app.amount}" oninput="calcPreview()"></div><div><label>Frecuencia</label><select id="l_freq" onchange="calcPreview()"><option value="monthly">Mensual</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="daily">Diario</option><option value="annual">Anual</option></select></div><div><label>Fecha inicio</label><input id="l_start" type="date" value="${today()}"></div></div><div class="grid3"><div><label>Grace days</label><input id="l_grace" type="number" value="${db.settings.grace}"></div><div><label>Late fee %</label><input id="l_late" type="number" value="${db.settings.lateFee}"></div><div><label>Aplicar late fee a</label><select id="l_lateBase"><option value="payment">Pago programado</option><option value="balance">Balance</option><option value="fixed">Monto fijo</option></select></div></div><label>Garantía / collateral</label><textarea id="l_col">${app.collateral||''}</textarea><div id="loanPreview" class="warn"></div><div class="row"><button class="btn gold" onclick="createLoanFromApp('${app.id}')">Crear préstamo</button><button class="btn dark" onclick="closeModal()">Cancelar</button></div></div></div>`; $('l_freq').value=app.freq; calcPreview();}
function calcPreview(){let data=readLoanFields(); let s=calcSchedule(data); $('loanPreview').innerHTML=`Pago: <b>${money(s.payment)}</b> · Total repayable: <b>${money(s.totalRepayable)}</b> · Interés: <b>${money(s.totalInterest)}</b>`;}
function readLoanFields(){return {principal:+$('l_amount').value||0,type:$('l_type').value,rate:+$('l_rate').value||0,terms:+$('l_terms').value||1,freq:$('l_freq').value,start:$('l_start').value,grace:+$('l_grace').value||0,lateFee:+$('l_late').value||0,lateBase:$('l_lateBase').value,collateral:$('l_col').value};}
const perYear={daily:365,weekly:52,biweekly:26,monthly:12,annual:1};
function calcSchedule(l){let totalInterest,totalRepayable,payment,rows=[],bal; if(l.type==='flat'){totalInterest=rnd(l.principal*l.rate/100); totalRepayable=rnd(l.principal+totalInterest); payment=rnd(totalRepayable/l.terms); let principalPart=rnd(l.principal/l.terms), interestPart=rnd(totalInterest/l.terms); bal=totalRepayable; for(let i=1;i<=l.terms;i++){bal=rnd(Math.max(0,bal-payment)); if(i===l.terms)bal=0; rows.push({num:i,due:addPeriod(l.start,l.freq,i),scheduled:payment,interest:interestPart,principal:principalPart,balance:bal,status:'pending'});} } else {let r=(l.rate/100)/(perYear[l.freq]||12); payment=r?rnd(l.principal*r*Math.pow(1+r,l.terms)/(Math.pow(1+r,l.terms)-1)):rnd(l.principal/l.terms); bal=l.principal; for(let i=1;i<=l.terms;i++){let interest=rnd(bal*r), principal=rnd(payment-interest); if(i===l.terms||principal>bal)principal=bal; bal=rnd(Math.max(0,bal-principal)); if(i===l.terms)bal=0; rows.push({num:i,due:addPeriod(l.start,l.freq,i),scheduled:payment,interest,principal,balance:bal,status:'pending'});} totalRepayable=rnd(rows.reduce((s,r)=>s+r.scheduled,0)); totalInterest=rnd(totalRepayable-l.principal);} return {payment,totalInterest,totalRepayable,rows};}
function addPeriod(date,freq,n){let d=new Date(date+'T00:00:00'); if(freq==='monthly')d.setMonth(d.getMonth()+n); else if(freq==='annual')d.setFullYear(d.getFullYear()+n); else d.setDate(d.getDate()+({daily:1,weekly:7,biweekly:14}[freq]||30)*n); return d.toISOString().slice(0,10);}
function createLoanFromApp(appId){let a=db.applications.find(x=>x.id===appId), f=readLoanFields(), st=detectState(a.address), sc=calcSchedule(f); let client=db.clients.find(c=>c.name===a.name&&c.phone===a.phone); if(!client){client={id:genId('CL',st),name:a.name,phone:a.phone,email:a.email,address:a.address,state:st,score:70,createdAt:today()}; db.clients.push(client);} let loan={id:genId('LN',st),clientId:client.id,applicationId:a.id,state:st,name:a.name,phone:a.phone,email:a.email,address:a.address,principal:f.principal,type:f.type,rate:f.rate,terms:f.terms,freq:f.freq,start:f.start,grace:f.grace,lateFee:f.lateFee,lateBase:f.lateBase,collateral:f.collateral,totalRepayable:sc.totalRepayable,totalInterest:sc.totalInterest,schedule:sc.rows,status:'active',createdAt:today(),contractId:null}; db.loans.push(loan); a.status='Converted to Contract'; createContract(loan.id,'es'); save(); closeModal(); show('detail',loan.id);}
function loansList(){setTitle('Préstamos','Loans activos e históricos'); $('topActions').innerHTML='<button class="btn gold" onclick="show(\'newApp\')">Nueva solicitud</button>'; $('page').innerHTML=`<div class="card">${loanTable(db.loans)}</div>`;}
function loanTable(loans){if(!loans.length)return '<p class="small">No hay préstamos.</p>'; return `<table class="table"><tr><th>ID</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Balance</th><th>Estado</th><th></th></tr>${loans.map(l=>{let s=loanSummary(l);return `<tr><td>${l.id}</td><td>${l.name}<br><span class="small">${l.address}</span></td><td>${l.type==='flat'?`Flat ${l.rate}%`:`APR ${l.rate}%`}</td><td>${money(l.totalRepayable)}</td><td>${money(s.remaining)}</td><td><span class="tag ${s.remaining<=0?'paid':s.overdue?'late':'active'}">${s.remaining<=0?'Paid':s.overdue?'Late':'Active'}</span></td><td><button class="btn dark" onclick="show('detail','${l.id}')">Abrir</button></td></tr>`}).join('')}</table>`;}
function loanSummary(l){let pays=db.payments.filter(p=>p.loanId===l.id), paid=pays.reduce((s,p)=>s+p.amount,0), fees=pays.reduce((s,p)=>s+(p.lateFee||0),0), remaining=rnd(Math.max(0,l.totalRepayable+fees-paid)); let overdue=l.schedule.filter(r=>new Date(r.due)<new Date(today())&&!pays.find(p=>p.period===r.num)).length; return {paid,fees,remaining,overdue};}
function loanDetail(id){let l=db.loans.find(x=>x.id===id); if(!l)return; setTitle(l.name,l.id); $('topActions').innerHTML=`<button class="btn gold" onclick="paymentModal('${id}')">Registrar pago</button><button class="btn dark" onclick="openDoc('${l.contractId}')">Contrato</button><button class="btn dark" onclick="statement('${id}')">Statement</button>`; let s=loanSummary(l), docs=db.documents.filter(d=>d.loanId===id), pays=db.payments.filter(p=>p.loanId===id); $('page').innerHTML=`<div class="cards"><div class="card"><div class="small">Principal</div><div class="metric">${money(l.principal)}</div></div><div class="card"><div class="small">Total repayable</div><div class="metric">${money(l.totalRepayable)}</div></div><div class="card"><div class="small">Cobrado</div><div class="metric">${money(s.paid)}</div></div><div class="card"><div class="small">Balance</div><div class="metric">${money(s.remaining)}</div></div></div><div class="grid2"><div class="card"><h3>Schedule</h3>${scheduleTable(l)}</div><div class="card"><h3>Documents</h3>${docs.map(d=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #2b2616;padding:8px 0"><span>${d.type} · ${d.id}</span><button class="btn dark" onclick="openDoc('${d.id}')">Abrir</button></div>`).join('')||'<p class="small">No documents.</p>'}<h3>Payments</h3>${pays.map(p=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #2b2616;padding:8px 0"><span>${p.id} · ${money(p.amount)}</span><button class="btn dark" onclick="openDoc('${p.receiptId}')">Recibo</button></div>`).join('')||'<p class="small">No payments.</p>'}</div></div>`;}
function scheduleTable(l){let pays=db.payments.filter(p=>p.loanId===l.id); return `<table class="table"><tr><th>#</th><th>Due</th><th>Scheduled</th><th>Paid</th><th>Balance</th><th>Receipt</th></tr>${l.schedule.map(r=>{let p=pays.find(x=>x.period===r.num);return `<tr><td>${r.num}</td><td>${r.due}</td><td>${money(r.scheduled)}</td><td>${p?money(p.amount):'—'}</td><td>${money(balanceAfterPeriod(l,r.num))}</td><td>${p?`<button class="btn dark" onclick="openDoc('${p.receiptId}')">Receipt</button>`:''}</td></tr>`}).join('')}</table>`;}
function balanceAfterPeriod(l,n){let pays=db.payments.filter(p=>p.loanId===l.id&&p.period<=n).reduce((s,p)=>s+p.amount,0), fees=db.payments.filter(p=>p.loanId===l.id&&p.period<=n).reduce((s,p)=>s+(p.lateFee||0),0); return rnd(Math.max(0,l.totalRepayable+fees-pays));}
function paymentModal(id){let l=db.loans.find(x=>x.id===id), next=l.schedule.find(r=>!db.payments.find(p=>p.loanId===id&&p.period===r.num))||l.schedule[0]; $('modal').innerHTML=`<div class="modal"><div class="box form"><h2>Registrar pago</h2><div class="grid3"><div><label>Cuota #</label><input id="p_period" type="number" value="${next.num}"></div><div><label>Monto pagado</label><input id="p_amount" type="number" value="${next.scheduled}"></div><div><label>Fecha pago</label><input id="p_date" type="date" value="${today()}"></div></div><div class="grid3"><div><label>Método/ref</label><input id="p_method" placeholder="Zelle ref..."></div><div><label><input id="p_late" type="checkbox"> Marcar late</label></div><div><label><input id="p_waive" type="checkbox"> Waive late fee</label></div></div><label>Notas</label><textarea id="p_note"></textarea><div class="row"><button class="btn gold" onclick="recordPayment('${id}')">Guardar pago</button><button class="btn dark" onclick="closeModal()">Cancelar</button></div></div></div>`;}
function recordPayment(id){let l=db.loans.find(x=>x.id===id), period=+$('p_period').value, row=l.schedule.find(r=>r.num===period), amount=+$('p_amount').value||0, paidDate=$('p_date').value; if(!row||amount<=0)return alert('Revisa cuota/monto'); let manualLate=$('p_late').checked, isLate=manualLate||new Date(paidDate)>new Date(addPeriod(row.due,'daily',l.grace)); let lateFee=0; if(isLate&&!$('p_waive').checked){lateFee=l.lateBase==='balance'?loanSummary(l).remaining*l.lateFee/100:l.lateBase==='fixed'?l.lateFee:row.scheduled*l.lateFee/100; lateFee=rnd(lateFee);} let extra=rnd(Math.max(0,amount-row.scheduled-lateFee)); let p={id:genId('PM',l.state),loanId:id,period,amount,date:paidDate,method:$('p_method').value,note:$('p_note').value,lateFee,extraPrincipal:extra,createdAt:today()}; db.payments.push(p); p.receiptId=createReceipt(p.id); adjustScore(l.clientId,isLate?-3:1,isLate?'Late payment':'On-time payment'); save(); closeModal(); show('detail',id);}
function adjustScore(clientId,delta,reason){let c=db.clients.find(x=>x.id===clientId); if(!c)return; c.score=Math.max(1,Math.min(100,(c.score||70)+delta)); db.scoreLog.push({clientId,date:today(),delta,reason,score:c.score});}
function createContract(loanId,lang='es'){let l=db.loans.find(x=>x.id===loanId), id=genId('CT',l.state); let html=contractHTML(l,lang,id); db.documents.push({id,loanId,type:'Contract',lang,html,createdAt:today()}); l.contractId=id; return id;}
function createReceipt(paymentId){let p=db.payments.find(x=>x.id===paymentId), l=db.loans.find(x=>x.id===p.loanId), id=genId('RC',l.state); let html=receiptHTML(l,p,id); db.documents.push({id,loanId:l.id,paymentId:p.id,type:'Receipt',html,createdAt:today()}); return id;}
function contractHTML(l,lang,id){let es=lang==='es'; return `<div class="doc"><div class="head"><b>Vincent Bank</b><span>Contract ID: ${id}</span></div><h1>${es?'Contrato formal de préstamo':'Formal Loan Agreement'}</h1><p>${es?'Este contrato documenta la oferta y aceptación de un préstamo privado entre':'This agreement documents the offer and acceptance of a private loan between'} <b>${db.settings.lender}</b> ${es?'como prestamista y':'as lender and'} <b>${l.name}</b> ${es?'como prestatario.':'as borrower.'}</p><h2>${es?'Términos':'Terms'}</h2><p>Loan ID: ${l.id}. Client ID: ${l.clientId}. Principal: ${money(l.principal)}. ${l.type==='flat'?'Flat Interest Rate':'APR'}: ${l.rate}%. Total repayable: ${money(l.totalRepayable)}. Payments: ${l.terms} ${l.freq}. Start: ${l.start}. Grace period: ${l.grace} days. Late fee: ${l.lateFee}%.</p><h2>${es?'Garantía':'Collateral'}</h2><p>${l.collateral||'No collateral provided.'}</p><p><i>Collateral may be subject to repossession, legal claim, sale, or other remedies permitted under applicable law in the event of default.</i></p><h2>${es?'Cláusulas':'Clauses'}</h2><p>${es?'Las partes aceptan voluntariamente este acuerdo y confirman capacidad legal para contratar. El prestatario confirma la recepción de los fondos. Este contrato solo podrá modificarse por escrito y firmado por ambas partes. Este acuerdo se regirá por las leyes del Estado de Nevada salvo que las partes acuerden otra jurisdicción por escrito. La falta de pago puede resultar en cargos, esfuerzos de cobro, acciones legales o ejecución de garantía sujeto a la ley aplicable.':'Both parties enter this agreement voluntarily and confirm legal capacity. Borrower confirms receipt of funds. This agreement may only be modified in writing signed by both parties. This agreement is governed by the laws of the State of Nevada unless otherwise agreed in writing. Failure to pay may result in fees, collection efforts, legal action, or collateral enforcement subject to applicable law.'}</p><div class="sig"><div><div class="line">${es?'Firma prestamista':'Lender signature'}</div><br><div class="line">${db.settings.lender}</div></div><div><div class="line">${es?'Firma prestatario':'Borrower signature'}</div><br><div class="line">${l.name}</div></div></div></div>`;}
function receiptHTML(l,p,id){let row=l.schedule.find(r=>r.num===p.period); return `<div class="doc"><div class="head"><b>Vincent Bank</b><span>Receipt ID: ${id}</span></div><h1>Payment Receipt / Recibo</h1><p>Loan ID: ${l.id}<br>Payment ID: ${p.id}<br>Client: ${l.name}<br>Payment #: ${p.period}<br>Due date: ${row?.due||''}<br>Payment date: ${p.date}</p><h2>Payment</h2><p>Scheduled amount: ${money(row?.scheduled)}<br>Amount paid: ${money(p.amount)}<br>Interest portion: ${money(row?.interest)}<br>Principal portion: ${money(row?.principal)}<br>Extra principal paid: ${money(p.extraPrincipal)}<br>Late fee: ${money(p.lateFee)}<br>Remaining balance after payment: ${money(balanceAfterPeriod(l,p.period))}</p><p>Method/reference: ${p.method||'—'}</p><div class="sig"><div><div class="line">Vincent Bank</div></div><div><div class="line">Borrower</div></div></div></div>`;}
function statement(id){let l=db.loans.find(x=>x.id===id), doc=`<div class="doc"><div class="head"><b>Vincent Bank</b><span>Statement · ${today()}</span></div><h1>Loan Statement / Estado de cuenta</h1><p>Loan ID: ${l.id}<br>Client: ${l.name}<br>Principal: ${money(l.principal)}<br>Total repayable: ${money(l.totalRepayable)}<br>Remaining balance: ${money(loanSummary(l).remaining)}</p>${scheduleTable(l)}</div>`; openHtml(doc);}
function openDoc(id){let d=db.documents.find(x=>x.id===id); if(!d)return alert('Documento no encontrado'); openHtml(d.html);}
function openHtml(html){$('modal').innerHTML=`<div class="modal"><div class="box" style="background:white"><div class="doc-actions row no-print"><button class="btn gold" onclick="window.print()">Imprimir / PDF</button><button class="btn dark" onclick="closeModal()">Cerrar</button></div>${html}</div></div>`;}
function closeModal(){$('modal').innerHTML='';}
function clientsList(){setTitle('Clientes','Score interno y datos'); $('page').innerHTML=`<div class="card"><table class="table"><tr><th>ID</th><th>Nombre</th><th>Estado</th><th>Score</th><th>Prestado</th></tr>${db.clients.map(c=>`<tr><td>${c.id}</td><td>${c.name}<br><span class="small">${c.address}</span></td><td>${c.state}</td><td>${c.score||70}</td><td>${money(db.loans.filter(l=>l.clientId===c.id).reduce((s,l)=>s+l.principal,0))}</td></tr>`).join('')}</table></div>`;}
function settingsPage(){setTitle('Settings','Configuración admin'); let s=db.settings; $('page').innerHTML=`<div class="card form"><div class="grid2"><div><label>Business name</label><input id="s_business" value="${s.business}"></div><div><label>Lender full name</label><input id="s_lender" value="${s.lender}"></div><div><label>Username</label><input id="s_user" value="${s.username}"></div><div><label>Password</label><input id="s_pass" value="${s.password}"></div><div><label>Default state</label><input id="s_state" value="${s.defaultState}"></div><div><label>Payment methods</label><input id="s_methods" value="${s.methods}"></div><div><label>Email</label><input id="s_email" value="${s.email}"></div><div><label>Phone</label><input id="s_phone" value="${s.phone}"></div></div><label>Address</label><input id="s_address" value="${s.address}"><button class="btn gold" style="margin-top:12px" onclick="saveSettings()">Guardar settings</button></div>`;}
function saveSettings(){Object.assign(db.settings,{business:$('s_business').value,lender:$('s_lender').value,username:$('s_user').value,password:$('s_pass').value,defaultState:$('s_state').value.toUpperCase(),methods:$('s_methods').value,email:$('s_email').value,phone:$('s_phone').value,address:$('s_address').value}); save(); alert('Guardado. Si cambiaste usuario/contraseña, úsalo en el próximo login.');}
function exportJSON(){let blob=new Blob([JSON.stringify({version:'1.0',exportedAt:new Date().toISOString(),db},null,2)],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vincentbank-backup-'+today()+'.json'; a.click();}
function importJSON(e){let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{let obj=JSON.parse(r.result); if(confirm('Importar backup y reemplazar datos actuales?')){db=obj.db||obj; save(); location.reload();}}catch(err){alert('JSON inválido')}}; r.readAsText(f);}
load(); restore();
</script>
</body>
</html>
